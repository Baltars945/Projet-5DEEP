name: build
on:
    pull_request:
        branches: ["main","develop"]
jobs:
    build-python:
        name: python
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v3
              
            
            - name: setup python
              uses: actions/setup-python@cv4
              with:
                python-version: '3.11'
                cachel: 'pip'
            
            - name: install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt